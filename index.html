<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>نمونه کار کارلنسر</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%; margin: 0;
      background: #0b1020; overflow: hidden;
      font-family: "Vazirmatn", Tahoma, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .stage { width: 100vw; height: 100vh; display: grid; place-items: center; }
    .canvas {
      position: relative; width: 1920px; height: 1080px;
      background: #111827; transform-origin: center center; overflow: hidden;
    }
    .slide {
      position: absolute; inset: 0; display: grid; place-items: center;
      color: #fff; opacity: 0; transform: translateX(40px);
      transition: opacity .45s ease, transform .45s ease;
      background-color: #1f2937;
    }
    .slide.active { opacity: 1; transform: none; }
    .slide-content {
      position: relative; z-index: 2; width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 40px; padding: 80px 120px;
    }
    .slide-content h1 {
      margin: 0; font-size: 96px; line-height: 1.2;
      font-weight: 800; text-shadow: 0 4px 18px rgba(0,0,0,.35);
    }
    .slide-content img {
      max-width: 100%; max-height: 600px;
      width: auto; height: auto; object-fit: contain;
      border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }
    .slide-content p {
      margin: 0; font-size: 30px; line-height: 1.9;
      color: rgba(255,255,255,.85); text-align: center;
      max-width: 900px; text-shadow: 0 2px 10px rgba(0,0,0,.3);
    }
    .nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 72px; height: 72px; border-radius: 50%; border: 0;
      background: rgba(255,255,255,.12); color: #fff;
      font-size: 40px; cursor: pointer; z-index: 10;
      display: grid; place-items: center; backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .nav:hover { background: rgba(255,255,255,.22); }
    .prev { left: 40px; }
    .next { right: 40px; }
    .dots {
      position: absolute; bottom: 40px; left: 50%;
      transform: translateX(-50%); display: flex; gap: 16px; z-index: 10;
    }
    .dot {
      width: 18px; height: 18px; border-radius: 50%; border: 0;
      background: rgba(255,255,255,.25); cursor: pointer; padding: 0;
    }
    .dot.active { background: #fff; }

    /* ===== تبلت (768px تا 1024px) ===== */
    @media (max-width: 1024px) {
      .slide-content {
        gap: 30px;
        padding: 60px 80px;
      }
      .slide-content h1 {
        font-size: 72px;
      }
      .slide-content img {
        max-height: 450px;
        border-radius: 12px;
      }
      .slide-content p {
        font-size: 24px;
        max-width: 700px;
      }
      .nav {
        width: 56px; height: 56px;
        font-size: 32px;
      }
      .prev { left: 24px; }
      .next { right: 24px; }
      .dots { bottom: 28px; gap: 12px; }
      .dot { width: 14px; height: 14px; }
    }

    /* ===== موبایل (زیر 768px) ===== */
    @media (max-width: 768px) {
      .slide-content {
        gap: 24px;
        padding: 40px 24px;
      }
      .slide-content h1 {
        font-size: 42px;
        line-height: 1.3;
      }
      .slide-content img {
        max-height: 300px;
        max-width: 90%;
        border-radius: 10px;
        box-shadow: 0 10px 30px rgba(0,0,0,.4);
      }
      .slide-content p {
        font-size: 18px;
        line-height: 1.8;
        max-width: 100%;
      }
      .nav {
        width: 44px; height: 44px;
        font-size: 24px;
        background: rgba(255,255,255,.15);
      }
      .prev { left: 12px; }
      .next { right: 12px; }
      .dots { bottom: 20px; gap: 10px; }
      .dot { width: 12px; height: 12px; }
    }

    /* ===== موبایل کوچک (زیر 480px) ===== */
    @media (max-width: 480px) {
      .slide-content {
        gap: 20px;
        padding: 32px 16px;
      }
      .slide-content h1 {
        font-size: 32px;
      }
      .slide-content img {
        max-height: 220px;
        border-radius: 8px;
      }
      .slide-content p {
        font-size: 16px;
        line-height: 1.7;
      }
      .nav {
        width: 40px; height: 40px;
        font-size: 20px;
      }
      .dots { bottom: 16px; gap: 8px; }
      .dot { width: 10px; height: 10px; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="canvas" id="canvas">

      <section class="slide active" data-page="index">
        <div class="slide-content">
          <h1>نقطه‌ی ورود</h1>
          <img src="index.jpg" alt="نقطه‌ی ورود">
          <p>
            ورودی یکپارچه با دسترسی سریع به کل بخش‌های پلتفرم، بدون لایه‌های اضافی.
          </p>
        </div>
      </section>

      <section class="slide" data-page="dashboard">
        <div class="slide-content">
          <h1>مرکز تصمیم</h1>
          <img src="dashboard.jpg" alt="مرکز تصمیم">
          <p>
            نمایش لحظه‌ای شاخص‌های کلیدی و گزارش‌های تحلیلی برای تصمیم‌گیری آگاهانه.
          </p>
        </div>
      </section>

      <section class="slide" data-page="kanban">
        <div class="slide-content">
          <h1>جریان کار</h1>
          <img src="kanban.jpg" alt="جریان کار">
          <p>
            مدیریت بصری چرخه‌ی حیات وظایف با قابلیت ردیابی وضعیت هر پروژه در لحظه.
          </p>
        </div>
      </section>

      <button class="nav prev" aria-label="قبلی">‹</button>
      <button class="nav next" aria-label="بعدی">›</button>
      <div class="dots"></div>

    </div>
  </div>

  <script>
    const canvas = document.getElementById("canvas");

    function fitCanvas() {
      const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      canvas.style.transform = `scale(${s})`;
    }
    window.addEventListener("resize", fitCanvas);
    fitCanvas();

    const slides = [...document.querySelectorAll(".slide")];
    const dotsWrap = document.querySelector(".dots");
    slides.forEach((_, i) => {
      const d = document.createElement("button");
      d.className = "dot" + (i === 0 ? " active" : "");
      d.setAttribute("aria-label", `رفتن به اسلاید ${i + 1}`);
      d.onclick = () => show(i);
      dotsWrap.appendChild(d);
    });
    const dots = [...dotsWrap.children];
    let cur = 0;

    function show(i) {
      cur = (i + slides.length) % slides.length;
      slides.forEach((s, j) => s.classList.toggle("active", j === cur));
      dots.forEach((d, j) => d.classList.toggle("active", j === cur));
    }

    document.querySelector(".prev").onclick = () => show(cur - 1);
    document.querySelector(".next").onclick = () => show(cur + 1);

    // ===== Swipe با انگشت (موبایل و تبلت) =====
    let touchStartX = 0;
    let touchEndX = 0;

    canvas.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches.screenX;
    }, { passive: true });

    canvas.addEventListener("touchend", (e) => {
      touchEndX = e.changedTouches.screenX;
      const diff = touchStartX - touchEndX;
      // اگر فاصله کشیدن بیش از ۵۰ پیکسل بود، اسلاید عوض شود
      if (Math.abs(diff) > 50) {
        if (diff > 0) {
          show(cur + 1); // کشیدن به چپ → اسلاید بعدی
        } else {
          show(cur - 1); // کشیدن به راست → اسلاید قبلی
        }
      }
    }, { passive: true });

    // ===== کلیدهای صفحه‌کلید (دسکتاپ) =====
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") show(cur + 1);
      if (e.key === "ArrowRight") show(cur - 1);
    });

    // ===== نمایش خودکار هر ۵ ثانیه =====
    let autoPlay = setInterval(() => show(cur + 1), 5000);

    // توقف خودکار هنگام تعامل کاربر
    function resetAutoPlay() {
      clearInterval(autoPlay);
      autoPlay = setInterval(() => show(cur + 1), 5000);
    }
    document.querySelector(".prev").addEventListener("click", resetAutoPlay);
    document.querySelector(".next").addEventListener("click", resetAutoPlay);
    dotsWrap.addEventListener("click", resetAutoPlay);
    canvas.addEventListener("touchstart", resetAutoPlay, { passive: true });
  </script>
</body>
</html>
